<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doodle Jump</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%; width: 100%; background: #222;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; font-family: sans-serif;
        }
        
        #game-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas { width: 100%; height: 100%; max-width: 450px; max-height: 800px; display: block; }

        #menu {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('./menu-bg.png') center / cover no-repeat;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 15%;
            z-index: 10;
        }
        .skins { display: flex; gap: 15px; margin-bottom: 20px; }
        .skin {
            width: 60px; height: 60px; border: 3px solid #ccc; border-radius: 8px;
            background: white; cursor: pointer; overflow: hidden;
        }
        .skin.active { border-color: green; }
        .skin img { width: 100%; height: 100%; object-fit: contain; }
        .btn {
            padding: 15px 40px; font-size: 20px; font-weight: bold;
            border: 3px solid black; border-radius: 8px; cursor: pointer; background: white;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="game" width="450" height="800"></canvas>
    </div>

    <div id="menu">
        <div class="skins">
            <div class="skin active" onclick="selectSkin(1, this)"><img src="./doodle1.png"></div>
            <div class="skin" onclick="selectSkin(2, this)"><img src="./doodle2.png"></div>
            <div class="skin" onclick="selectSkin(3, this)"><img src="./doodle3.png"></div>
        </div>
        <button class="btn" onclick="startGame()">Начать игру</button>
    </div>

    <script>
        let chosenSkin = 1;
        let cvs = document.getElementById('game');
        let ctx = cvs.getContext('2d');
        
        let platforms = [], score = 0, maxHeight = 0, isDead = false, rocketTime = 0;
        let currentBgIndex = 0, nextBgIndex = 0;
        let player = { x: 200, y: 400, w: 40, h: 60, vy: 0, vx: 0 };
        let keys = { ArrowLeft: false, ArrowRight: false };
        
        const imgs = {};
        let gameLoopId = null;
        let gameReady = false;

        function loadImages(skinId) {
            return new Promise((resolve) => {
                let loaded = 0;
                const srcs = {
                    player: './doodle' + skinId + '.png',
                    rocket: './rocket_doodle.png',
                    monster: './monster.png',
                    coin: './coin.png',
                    platGreen: './platform_green.png',
                    platBlue: './platform_blue.png',
                    bg1: './bg1.png', bg2: './bg2.png', bg3: './bg3.png', bg4: './bg4.png', bg5: './bg5.png'
                };
                const total = Object.keys(srcs).length;
                
                for (let key in srcs) {
                    imgs[key] = new Image();
                    imgs[key].onload = imgs[key].onerror = () => {
                        loaded++;
                        if (loaded === total) resolve();
                    };
                    imgs[key].src = srcs[key];
                }
            });
        }

        async function init() {
            await loadImages(chosenSkin);
            
            function spawnPlatform(y) {
                return {
                    x: 30 + Math.random() * 330, y: y,
                    color: Math.random() > 0.5 ? 'green' : 'blue',
                    item: Math.random() < 0.2 ? (Math.random() < 0.1 ? 'monster' : 'coin') : null
                };
            }

            for (let y = 750; y > 0; y -= 80) platforms.push(spawnPlatform(y));
            gameReady = true;
            loop();
        }

        function selectSkin(num, el) {
            chosenSkin = num;
            document.querySelectorAll('.skin').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
        }

        function startGame() {
            if (!gameReady) return;
            document.getElementById('menu').style.display = 'none';
            
            platforms = [];
            score = 0; maxHeight = 0; isDead = false; rocketTime = 0;
            currentBgIndex = 0; nextBgIndex = 0;
            player = { x: 200, y: 400, w: 40, h: 60, vy: 0, vx: 0 };
            
            function spawnPlatform(y) {
                return {
                    x: 30 + Math.random() * 330, y: y,
                    color: Math.random() > 0.5 ? 'green' : 'blue',
                    item: Math.random() < 0.2 ? (Math.random() < 0.1 ? 'monster' : 'coin') : null
                };
            }
            for (let y = 750; y > 0; y -= 80) platforms.push(spawnPlatform(y));
            
            imgs.player.src = './doodle' + chosenSkin + '.png';
        }

        function update() {
            if (isDead) return;

            if (rocketTime > 0) { player.vy = -18; rocketTime--; }
            else { player.vy += 0.4; }

            player.y += player.vy;
            player.x += player.vx;

            if (player.x < -40) player.x = 450;
            if (player.x > 450) player.x = -40;

            if (keys['ArrowLeft']) player.vx = -5;
            else if (keys['ArrowRight']) player.vx = 5;
            else player.vx *= 0.8;

            if (player.vy < 0 && player.y < 400) {
                let diff = -player.vy;
                player.y += diff;
                maxHeight += diff;
                platforms.forEach(p => p.y += diff);
            }

            if (player.y > 800) isDead = true;

            platforms.forEach(p => {
                if (player.vy > 0 && player.y + player.h > p.y && player.y + player.h < p.y + 30 &&
                    player.x + player.w > p.x && player.x < p.x + 65) {
                    
                    player.vy = -12;
                    player.y = p.y - player.h;

                    if (p.item === 'coin') { score++; p.item = null; }
                    if (p.item === 'monster') { score -= 5; p.item = null; }
                    if (Math.random() < 0.03) { rocketTime = 150; }
                }
            });

            if (platforms[platforms.length - 1].y > 0) {
                platforms.push({
                    x: 30 + Math.random() * 330,
                    y: platforms[platforms.length - 1].y - 80,
                    color: Math.random() > 0.5 ? 'green' : 'blue',
                    item: Math.random() < 0.2 ? (Math.random() < 0.1 ? 'monster' : 'coin') : null
                });
            }
            platforms = platforms.filter(p => p.y < 850);

            if (score >= 100) isDead = true;

            let bgProgress = maxHeight / 3000;
            currentBgIndex = Math.floor(bgProgress) % 5;
            nextBgIndex = (currentBgIndex + 1) % 5;
        }

        function draw() {
            ctx.clearRect(0, 0, 450, 800);

            let bgProgress = maxHeight / 3000;
            let alpha = bgProgress - Math.floor(bgProgress);
            let bgArr = [imgs.bg1, imgs.bg2, imgs.bg3, imgs.bg4, imgs.bg5];

            if (bgArr[currentBgIndex] && bgArr[currentBgIndex].complete) {
                ctx.drawImage(bgArr[currentBgIndex], 0, 0, 450, 800);
            } else {
                ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, 450, 800);
            }

            if (alpha > 0 && bgArr[nextBgIndex] && bgArr[nextBgIndex].complete) {
                ctx.globalAlpha = alpha;
                ctx.drawImage(bgArr[nextBgIndex], 0, 0, 450, 800);
                ctx.globalAlpha = 1;
            }

            platforms.forEach(p => {
                let img = p.color === 'green' ? imgs.platGreen : imgs.platBlue;
                if (img && img.complete) ctx.drawImage(img, p.x, p.y, 65, 20);
                else { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 65, 20); }

                if (p.item === 'coin' && imgs.coin.complete) ctx.drawImage(imgs.coin, p.x + 20, p.y - 30, 25, 25);
                if (p.item === 'monster' && imgs.monster.complete) ctx.drawImage(imgs.monster, p.x + 10, p.y - 40, 45, 45);
            });

            if (rocketTime > 0 && imgs.rocket.complete) {
                ctx.drawImage(imgs.rocket, player.x - 10, player.y - 10, 60, 80);
            } else if (imgs.player.complete) {
                ctx.drawImage(imgs.player, player.x, player.y, 40, 60);
            } else {
                ctx.fillStyle = 'yellow'; ctx.fillRect(player.x, player.y, 40, 60);
            }

            ctx.fillStyle = 'black';
            ctx.font = 'bold 24px Arial';
            ctx.fillText('Счет: ' + score, 20, 40);

            if (isDead) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, 450, 800);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Конец игры', 225, 350);
                ctx.font = '24px Arial';
                ctx.fillText('Счет: ' + score, 225, 400);
                ctx.fillText('Коснись экрана', 225, 450);
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            if (!isDead && document.getElementById('menu').style.display === 'none') {
                update();
            }
            draw();
            gameLoopId = requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', e => { 
            if(keys && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) keys[e.code] = true;
        });
        window.addEventListener('keyup', e => { 
            if(keys && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) keys[e.code] = false;
        });

        cvs.addEventListener('touchstart', e => {
            if (document.getElementById('menu').style.display !== 'none') return;
            if (isDead) { restart(); return; }
            let touchX = e.touches[0].clientX;
            let rect = cvs.getBoundingClientRect();
            if (touchX - rect.left < rect.width / 2) keys['ArrowLeft'] = true;
            else keys['ArrowRight'] = true;
        }, {passive: true});
        
        cvs.addEventListener('touchend', () => { 
            if(keys) { keys['ArrowLeft'] = false; keys['ArrowRight'] = false; }
        }, {passive: true});

        cvs.addEventListener('click', () => { if (isDead) restart(); });

        function restart() {
            document.getElementById('menu').style.display = 'flex';
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
        }

        init();
    </script>
</body>
</html>
